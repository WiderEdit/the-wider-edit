name: Published mobile layout
on:
  workflow_run:
    workflows: [pages build and deployment]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-layout.yml'
      - 'checks/mobile-layout.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-mobile-layout
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Check published mobile pages
        run: node checks/mobile-layout.mjs
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-mobile-layout
          path: layout-report/
          retention-days: 7
          if-no-files-found: ignore
